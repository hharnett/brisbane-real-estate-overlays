<!doctype html>
<html lang="en">

<title>Realestate map preview fixture</title>
<!-- Sanitized from the visible REA map preview inspected on 29 October 2026.
     Preserve the map/card/address structure; use fictional listing data.
     No third-party scripts, images, tracking parameters, or saved page data. -->
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #243746; }
  .gm-style { min-height: 540px; padding: 36px; background: #e8ede5; }
  [class*="Styles__StyledCard-"] { display: flex; width: 420px; height: 166px; background: white; border-radius: 8px; box-shadow: 0 3px 14px #0003; overflow: hidden; }
  [class*="Styles__ImageContainer-"] { width: 166px; flex: 0 0 166px; background: #c8d5d7; display: grid; place-items: center; color: #40585b; }
  [class*="Styles__DetailsContainer-"] { flex: 1; min-width: 0; padding: 12px 16px; }
  [class*="Styles__DetailsContainer-"] p { margin: 0 0 8px; }
  [class*="Styles__AddressLink-"] { color: inherit; text-decoration: none; }
  [class*="Styles__Address-"] { display: inline; font-weight: 600; }
  ul { display: flex; gap: 16px; padding: 0; list-style: none; font-size: 14px; }
</style>
<body>
  <div class="gm-style">
    <div class="gm-style-iw">
      <div class="Card__Box-sc-3mecgt-0 Styles__StyledCard-sc-1v2bwjv-0">
        <div class="Styles__ImageContainer-sc-1v2bwjv-1" aria-label="Property image placeholder">Property image</div>
        <div class="Styles__DetailsContainer-sc-1v2bwjv-13">
          <div>
            <p class="Styles__PropertyType-sc-1v2bwjv-4">House for sale</p>
            <p class="Styles__HeadlineText-sc-1v2bwjv-5">For Sale</p>
            <a href="https://www.realestate.com.au/property-house-qld-brighton-123456789" target="_blank" rel="noopener noreferrer" aria-label="12 Example Road, Brighton" class="Styles__AddressLink-sc-1v2bwjv-12">
              <p class="Styles__Address-sc-1v2bwjv-7">12 Example Road,&nbsp;</p><p class="Styles__Address-sc-1v2bwjv-7">Brighton</p>
            </a>
          </div>
          <ul aria-label="3 bedrooms 1 bathroom 1 car space"><li>3 beds</li><li>1 bath</li><li>1 car</li></ul>
        </div>
      </div>
    </div>
  </div>
</body>
